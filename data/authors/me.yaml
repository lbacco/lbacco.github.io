bio: |
  I am an Assistant Professor in the Department of Engineering at
  Università Campus Bio-Medico di Roma. My research focuses on artificial
  intelligence, with particular interests in natural language processing,
  large language models, multimodal learning, explainable AI, and biomedical
  applications.

  I am particularly interested in developing reliable and data-efficient
  machine learning methods for low-data and specialized-domain settings,
  and in translating advances in AI into interdisciplinary biomedical
  research.

