name: Single publications page (Gao-style)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-publications-page:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Create single Publications layout
        shell: bash
        run: |
          set -euo pipefail
          rm -rf content/all-publications content/journal-articles content/conference-papers
          mkdir -p content/publications layouts/publications-single data static/uploads
          echo 'LS0tCnRpdGxlOiBQdWJsaWNhdGlvbnMKdHlwZTogcHVibGljYXRpb25zLXNpbmdsZQphbGlhc2VzOgogIC0gL2FsbC1wdWJsaWNhdGlvbnMvCiAgLSAvam91cm5hbC1hcnRpY2xlcy8KICAtIC9jb25mZXJlbmNlLXBhcGVycy8KLS0tCg==' | base64 --decode > content/publications/_index.md
          echo '' | base64 --decode > layouts/publications-single/list.html
          echo '' | base64 --decode > data/publication_descriptions.json
          if [ -f assets/media/authors/me.png ]; then
            cp assets/media/authors/me.png static/uploads/profile.png
          fi

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Redesign publications as a single Gao-style page"
          git push
