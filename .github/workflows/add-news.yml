name: Add News section and homepage feed

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Create News content
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p content/news/medicon-2026-chair content/news/aime-2026-ottawa content/news/eight-papers-medicon-2026
          echo '' | base64 --decode > content/news/_index.md
          echo '' | base64 --decode > content/news/medicon-2026-chair/index.md
          echo '' | base64 --decode > content/news/aime-2026-ottawa/index.md
          echo '' | base64 --decode > content/news/eight-papers-medicon-2026/index.md

      - name: Show latest 5 News on homepage
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import re
          path = Path('content/_index.md')
          text = path.read_text(encoding='utf-8')
          block = base64.b64decode('').decode('utf-8')
          text = re.sub(r'\n  # NEWS_BLOCK_START.*?  # NEWS_BLOCK_END\n', '\n', text, flags=re.S)
          if not text.startswith('---'):
              raise SystemExit('content/_index.md does not start with YAML front matter.')
          closing = text.find('\n---', 3)
          if closing == -1:
              raise SystemExit('Could not find the closing YAML delimiter in content/_index.md.')
          text = text[:closing] + block + text[closing:]
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/news content/_index.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Add News section and latest News to homepage"
          git push
