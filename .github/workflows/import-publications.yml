name: Import publications

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-publications:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install HugoBlox Academic File Converter
        run: python -m pip install --upgrade academic

      - name: Remove template publications
        run: |
          rm -rf content/publications
          mkdir -p content/publications

      - name: Import BibTeX publications
        run: academic import publications.bib content/publications/ --compact --overwrite

      - name: Add publications listing page
        run: |
          cat > content/publications/_index.md <<'EOF'
          ---
          title: Publications
          ---
          EOF

      - name: Commit generated publication pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/publications
          if git diff --cached --quiet; then
            echo "No publication changes to commit."
          else
            git commit -m "Import publications from CV BibTeX"
            git push
          fi
