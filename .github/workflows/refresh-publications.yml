name: Refresh enriched publications

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-publications:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install HugoBlox Academic File Converter
        run: python -m pip install --upgrade academic

      - name: Rebuild publication pages from enriched BibTeX
        run: |
          rm -rf content/publications
          mkdir -p content/publications
          academic import publications_enriched.bib content/publications/ --compact --overwrite

      - name: Add publications listing page
        run: |
          cat > content/publications/_index.md <<'EOF'
          ---
          title: Publications
          ---
          EOF

      - name: Mark selected publications as featured
        run: |
          python - <<'PY'
          from pathlib import Path

          featured_titles = [
              'Artificial intelligence based intervertebral discs grading: From unsupervised detection to explainable Pfirrmann classification',
              'Cross-Lingual Distillation for Domain Knowledge Transfer with Sentence Transformers',
              'Efficient Multi-Task Learning with Instance Selection for Biomedical NLP',
              'From Pre-training to Fine-tuning: an in-depth Analysis of Large Language Models in the Biomedical Domain',
              'A Text Style Transfer System for Reducing the Physician-Patient Expertise Gap: an Analysis with Automatic and Human Evaluations',
              'On the Instability of Further Pre-Training: Does a Single Sentence Matter to BERT?',
          ]

          def norm(s):
              return ' '.join(s.lower().replace('–','-').replace('—','-').split())

          targets = [norm(t) for t in featured_titles]
          count = 0
          for path in Path('content/publications').glob('*/index.md'):
              text = path.read_text(encoding='utf-8')
              ntext = norm(text)
              if not any(t in ntext for t in targets):
                  continue
              lines = text.splitlines()
              if lines and lines[0].strip() == '---':
                  end = next((i for i in range(1, len(lines)) if lines[i].strip() == '---'), None)
                  if end is not None:
                      found = False
                      for i in range(1, end):
                          if lines[i].lstrip().startswith('featured:'):
                              lines[i] = 'featured: true'
                              found = True
                              break
                      if not found:
                          lines.insert(end, 'featured: true')
                      path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
                      count += 1
          print(f'Marked {count} publications as featured.')
          if count != 6:
              raise SystemExit(f'Expected to mark 6 featured publications, found {count}.')
          PY

      - name: Keep enriched BibTeX as canonical bibliography
        run: cp publications_enriched.bib publications.bib

      - name: Commit enriched publication metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/publications publications.bib
          if git diff --cached --quiet; then
            echo "No publication changes to commit."
          else
            git commit -m "Enrich publication metadata with DOI links"
            git push
          fi
